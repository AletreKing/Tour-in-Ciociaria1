<style>
:root{
  --bg:#eef0eb; --ink:#1f2a26; --dim:#5d6a63; --line:#c3cbbf; --panel:#fbfcf8; --accent:#1e6a5a; --accent-ink:#fff; --warn:#b4621a; --bad:#b23b2b;
  --c-arch:#b0781c; --c-fede:#4a5fa8; --c-cast:#7a5a86; --c-muse:#1f8a86; --c-nat:#3f8a3a; --c-lett:#b04a68; --c-alt:#7d857f;
  --g1:#b23b2b; --g2:#c9861d; --g3:#4a5fa8; --g4:#3f8a3a; --g5:#1e6a5a;
  --f-disp:"Cinzel",Georgia,serif; --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif; color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --ink:#e7ece8; --dim:#9aa8a1; --line:#2c3833; --panel:#151d1a; --accent:#5cc2a8; --accent-ink:#0d1512; --warn:#f0a83a; --bad:#ef8a70;
  --c-arch:#e0a440; --c-fede:#8ea2ec; --c-cast:#c19ccf; --c-muse:#4cc7c2; --c-nat:#7fc86f; --c-lett:#ec8aa6; --c-alt:#9aa59f;
  --g1:#ef8a70; --g2:#f0a83a; --g3:#8ea2ec; --g4:#7fc86f; --g5:#5cc2a8; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111715; --ink:#e7ece8; --dim:#9aa8a1; --line:#2c3833; --panel:#151d1a; --accent:#5cc2a8; --accent-ink:#0d1512; --warn:#f0a83a; --bad:#ef8a70;
  --c-arch:#e0a440; --c-fede:#8ea2ec; --c-cast:#c19ccf; --c-muse:#4cc7c2; --c-nat:#7fc86f; --c-lett:#ec8aa6; --c-alt:#9aa59f; --g1:#ef8a70; --g2:#f0a83a; --g3:#8ea2ec; --g4:#7fc86f; --g5:#5cc2a8; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{margin:0;font:700 21px/1.1 var(--f-disp);letter-spacing:.03em}
.top h1 em{font-style:normal;font-weight:500;color:var(--accent)}
.top .who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--dim)}
.top .who input{width:150px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px}
.top .acts{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.del{color:var(--bad)}
.wrap{display:grid;grid-template-columns:minmax(300px,420px) 1fr;height:calc(100vh - 64px)}
.side,.ed{overflow:auto}
@media (max-width:820px){.wrap{grid-template-columns:1fr;height:auto}.side,.ed{overflow:visible}.ed{border-left:0;border-top:1px solid var(--line)}}
.side{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.gb{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 10px;text-align:left;cursor:pointer;display:grid;gap:0}
.gb b{font-size:24px;line-height:1.1;color:var(--g)}
.gb span{font-size:13px;color:var(--dim)}
.gb[aria-pressed="true"]{border-color:var(--g);box-shadow:inset 0 0 0 2px var(--g)}
.filt{display:flex;gap:8px;margin-bottom:8px}
.filt input,.filt select{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 9px}
.list{display:grid;gap:2px}
.li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:none;border-radius:8px;padding:7px 6px;cursor:pointer}
.li:hover{background:var(--panel)}
.li[aria-current="true"]{background:var(--panel);box-shadow:inset 3px 0 0 var(--accent)}
.li i{width:11px;height:11px;background:var(--c);clip-path:polygon(18% 0,82% 6%,100% 52%,74% 100%,10% 88%,0 38%)}
.li small{color:var(--dim);font-size:12px;text-align:right}
.li .loc{color:var(--warn);font-weight:700}
.note{font-size:13px;color:var(--dim)}
.ed{padding:16px 22px 60px;border-left:1px solid var(--line);min-width:0}
.ed h2{margin:2px 0 0;font:700 24px/1.2 var(--f-disp)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);font-weight:700}
.tag i{width:10px;height:10px;background:var(--c);clip-path:polygon(18% 0,82% 6%,100% 52%,74% 100%,10% 88%,0 38%)}
.st{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--g);color:var(--g);margin-left:8px;vertical-align:middle}
fieldset{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0 0;background:var(--panel)}
legend{font-weight:700;padding:0 6px}
label.f{display:grid;gap:4px;font-size:14px;color:var(--dim);margin-top:8px}
label.f input,label.f textarea,label.f select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;color:var(--ink);width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.web{font-size:14px}
.web p{margin:4px 0}
.ok{color:var(--g4);font-weight:700}.no{color:var(--g1);font-weight:700}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.th{width:150px;display:grid;gap:4px;font-size:12px}
.th img{width:150px;height:100px;object-fit:cover;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.th input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 6px;font-size:12px;width:100%}
.item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:var(--bg)}
.sres{display:grid;gap:4px;margin-top:6px}
.sres button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:14px}
.sres small{display:block;color:var(--dim)}
.empty{padding:30px 10px;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30}
.help{font-size:14px;color:var(--dim)}
.help ol{margin:6px 0 0;padding-left:20px}
</style>

<header class="top">

</header>
<div class="wrap">
  <aside class="side">
    <div class="groups" id="groups"></div>
    <div class="filt"><input id="q" type="search" placeholder="Cerca luogo o comune"><select id="cat"></select></div>
    <p class="note" id="sum"></p>
    <div class="list" id="list"></div>
  </aside>
  <main class="ed" id="ed"></main>
</div>

,"c":"fede","com":"Cervaro","w":"","wd":"Q25112957","t":""},{"n":"Chiesa di San Benedetto Abate","nome":"","c":"fede","com":"Cervaro","w":"","wd":"Q135917975","t":""},{"n":"Chiesa di San Paolo","nome":"","c":"fede","com":"Cervaro","w":"","wd":"Q135918023","t":""},{"n":"Chiesa del Santissimo Salvatore","nome":"","c":"fede","com":"Pignataro Interamna","w":"","wd":"Q135919131","t":""},{"n":"Chiesa della Madonna dei Sette Dolori","nome":"","c":"fede","com":"Pignataro Interamna","w":"","wd":"Q135919157","t":""},{"n":"Chiesa della Madonna Addolorata","nome":"","c":"fede","com":"Terelle","w":"","wd":"Q120824763","t":""},{"n":"Chiesa di Santa Maria della Pace e San Barbato","nome":"","c":"fede","com":"Casalattico","w":"","wd":"Q120824431","t":""},{"n":"Chiesa di Santa Margherita Vergine e Martire","nome":"","c":"fede","com":"Roccasecca","w":"","wd":"Q120824690","t":""},{"n":"Chiesa di Santa Maria Assunta","nome":"","c":"fede","com":"Roccasecca","w":"","wd":"Q120824691","t":""},{"n":"Chiesa di San Vito vecchia","nome":"","c":"fede","com":"Roccasecca","w":"","wd":"Q120824688","t":""},{"n":"Chiesa di San Francesco","nome":"","c":"fede","com":"Roccasecca","w":"","wd":"Q120824682","t":""},{"n":"Chiesa di San Rocco","nome":"","c":"fede","com":"Rocca d'Arce","w":"","wd":"Q120824670","t":""},{"n":"Chiesa di San Cataldo","nome":"","c":"fede","com":"Rocca d'Arce","w":"","wd":"Q120824669","t":""},{"n":"Chiesa di Santa Maria de Paris","nome":"","c":"fede","com":"Rocca d'Arce","w":"","wd":"Q120824673","t":""},{"n":"Chiesa di Santa Felicita","nome":"","c":"fede","com":"Settefrati","w":"","wd":"Q120824715","t":""},{"n":"Chiesa di Santa Maria della Consolazione","nome":"","c":"fede","com":"Settefrati","w":"","wd":"Q120824716","t":""},{"n":"Chiesa della Madonna di Loreto","nome":"","c":"fede","com":"Campoli Appennino","w":"","wd":"Q120824422","t":""},{"n":"Palazzo Simoncelli","nome":"","c":"cast","com":"Boville Ernica","w":"","wd":"Q135925638","t":""},{"n":"Chiesa di Santa Maria Assunta","n <script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var D=JSON.parse($('data').textContent),CAT=D.cat;
var POI=D.poi.map(function(o){return{k:o.n+'|'+(o.com||''),n:o.nome||o.n,c:CAT[o.c]?o.c:'alt',com:o.com||'',w:o.w||'',wd:o.wd||'',t0:o.t||''};});
var BYK={};POI.forEach(function(p){BYK[p.k]=p;});
var GR=[['vuota','Vuote','--g1'],['img','Solo immagini','--g2'],['txt','Solo testo','--g3'],['both','Immagini e testo','--g4'],['plus','Con aggiunte','--g5']];
var S={base:{},loc:{},wk:{},group:'vuota',sel:null,cat:'',q:'',imp:{radio:true},impBase:{radio:true}};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},2600);}
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem('cdsa_'+k));localStorage.setItem('cdsa_'+k,JSON.stringify(v));}catch(e){return null;}}

/* ---------- archivio locale: modifiche e foto caricate (IndexedDB) ---------- */
var DB=null;
function db(){if(DB)return DB;DB=new Promise(function(ok,ko){var r=indexedDB.open('cds-admin',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');r.result.createObjectStore('img');};r.onsuccess=function(){ok(r.result);};r.onerror=function(){ko(r.error);};});return DB;}
function idb(store,mode,fn){return db().then(function(d){return new Promise(function(ok,ko){var t=d.transaction(store,mode),s=t.objectStore(store),res=fn(s);t.oncomplete=function(){ok(res instanceof IDBRequest?res.result:res);};t.onerror=function(){ko(t.error);};});});}
function saveLoc(){return idb('kv','readwrite',function(s){return s.put(S.loc,'loc');});}
function putImg(name,blob){return idb('img','readwrite',function(s){return s.put(blob,name);});}
function getImg(name){return idb('img','readonly',function(s){return s.get(name);});}
function allImgNames(){return idb('img','readonly',function(s){return s.getAllKeys();});}
var URLS={};
function imgURL(src,el){
  if(!/^foto\//.test(src)){el.src=src;return;}
  if(URLS[src]){el.src=URLS[src];return;}
  getImg(src).then(function(b){if(b){URLS[src]=URL.createObjectURL(b);el.src=URLS[src];}else el.src=src;}).catch(function(){el.src=src;});
}

/* ---------- stato di una scheda ---------- */
function cur(k){return S.loc[k]||S.base[k]||null;}
function status(p){
  var s=cur(p.k)||{},w=S.wk[p.k]||{};
  var plus=(s.foto||[]).length||(s.video||[]).length||(s.extra||[]).length||(s.link||[]).length;
  if(plus)return'plus';
  var txt=!!(s.t||p.t0||w.txt||s.w),img=!!w.img;
  return txt&&img?'both':img?'img':txt?'txt':'vuota';
}
/* controllo su Wikidata: foto (P18, P373) e voce di Wikipedia, a gruppi di 50 */
function checkWeb(){
  var cache=ls('wk')||{};S.wk=cache.d||{};
  if(cache.t&&Date.now()-cache.t<7*864e5){draw();return;}
  var ids=POI.filter(function(p){return p.wd;}),i=0,got={};
  POI.forEach(function(p){if(p.w)got[p.k]={txt:true,img:false};});
  function next(){
    if(i>=ids.length){S.wk=got;ls('wk',{t:Date.now(),d:got});draw();return;}
    var part=ids.slice(i,i+50);i+=50;
    fetch('https://www.wikidata.org/w/api.php?format=json&origin=*&action=wbgetentities&props=claims|sitelinks&sitefilter=itwiki|enwiki&ids='+part.map(function(p){return p.wd;}).join('|'))
      .then(function(r){return r.json();}).then(function(j){
        part.forEach(function(p){var e=j.entities&&j.entities[p.wd];if(!e)return;var c=e.claims||{},sl=e.sitelinks||{};got[p.k]={img:!!(c.P18||c.P373),txt:!!(p.w||sl.itwiki||sl.enwiki)};});
        draw();next();
      }).catch(function(){S.offline=true;S.wk=got;draw();});
  }
  next();
}

/* ---------- elenco ---------- */
function draw(){
  var cnt={};GR.forEach(function(g){cnt[g[0]]=0;});POI.forEach(function(p){p.st=status(p);cnt[p.st]++;});
  $('groups').innerHTML=GR.map(function(g){return'<button class="gb" type="button" data-g="'+g[0]+'" style="--g:var('+g[2]+')" aria-pressed="'+(S.group===g[0])+'"><b>'+cnt[g[0]]+'</b><span>'+g[1]+'</span></button>';}).join('');
  var q=S.q.toLowerCase(),L=POI.filter(function(p){return p.st===S.group&&(!S.cat||p.c===S.cat)&&(!q||(p.n+' '+p.com).toLowerCase().indexOf(q)>=0);}).sort(function(a,b){return(a.com+a.n).localeCompare(b.com+b.n,'it');});
  var nl=Object.keys(S.loc).length;
  $('sum').textContent=L.length+' schede in questo gruppo'+(nl?' · '+nl+' modificate da te e non ancora pubblicate (in arancione)':'')+(S.offline?' · senza rete: lo stato delle foto e dei testi da internet non è verificato':'');
  $('list').innerHTML=L.length?L.map(function(p){return'<button class="li" type="button" data-k="'+esc(p.k)+'" style="--c:var(--c-'+p.c+')" aria-current="'+(S.sel===p.k)+'"><i></i><span>'+esc(p.n)+'</span><small'+(S.loc[p.k]?' class="loc"':'')+'>'+esc(p.com)+'</small></button>';}).join(''):'<p class="empty">Nessuna scheda in questo gruppo.</p>';
}
$('groups').addEventListener('click',function(e){var b=e.target.closest('.gb');if(!b)return;S.group=b.dataset.g;draw();});
$('list').addEventListener('click',function(e){var b=e.target.closest('.li');if(!b)return;S.sel=b.dataset.k;draw();edit();});
$('q').addEventListener('input',function(){S.q=this.value;draw();});
$('cat').innerHTML='<option value="">Tutte le categorie</option>'+Object.keys(CAT).map(function(c){return'<option value="'+c+'">'+CAT[c]+'</option>';}).join('');
$('cat').addEventListener('change',function(){S.cat=this.value;draw();});
$('who').value=ls('who')||'';$('who').addEventListener('change',function(){ls('who',this.value.trim());});

/* ---------- editor della scheda ---------- */
function work(k){if(!S.loc[k])S.loc[k]=JSON.parse(JSON.stringify(cur(k)||{}));return S.loc[k];}
function touch(k){var s=S.loc[k];s.ts=Date.now();s.da=$('who').value.trim()||'anonimo';saveLoc();draw();}
function edit(){
  var p=BYK[S.sel],el=$('ed');if(!p){el.innerHTML=help();return;}
  var s=cur(p.k)||{},w=S.wk[p.k],g=GR.filter(function(x){return x[0]===status(p);})[0];
  var h='<span class="tag" style="--c:var(--c-'+p.c+')"><i></i>'+CAT[p.c]+'</span><h2>'+esc(p.n)+'<span class="st" style="--g:var('+g[2]+')">'+g[1]+'</span></h2><p class="note">'+esc(p.com)+(s.ts?' · ultima modifica di '+esc(s.da||'?')+' il '+new Date(s.ts).toLocaleDateString('it-IT'):'')+'</p>';
  /* da internet */
  var wl=s.w||p.w;
  h+='<fieldset class="web"><legend>Da internet</legend>';
  h+='<p>Voce di Wikipedia: '+(wl?'<a target="_blank" rel="noopener" href="https://'+wl.split(':')[0]+'.wikipedia.org/wiki/'+encodeURIComponent(wl.split(':').slice(1).join(':').replace(/ /g,'_'))+'">'+esc(wl.split(':').slice(1).join(':'))+'</a>'+(s.w?' (collegata a mano)':''):(w&&w.txt?'<span class="ok">sì</span> (tramite Wikidata)':'<span class="no">nessuna</span>'))+'</p>';
  h+='<p>Foto da Wikimedia Commons: '+(p.wd?(w?(w.img?'<span class="ok">sì</span>':'<span class="no">nessuna</span>'):'da verificare (serve la rete)'):(s.w||p.w?'la foto principale della voce di Wikipedia, se c\u2019è':'<span class="no">luogo non collegato a Wikidata</span>'))+'</p>';
  h+='<div class="row"><input id="wq" class="btn" style="font-weight:400;flex:1;min-width:180px;border-radius:8px" value="'+esc(p.n+' '+p.com)+'"><button class="btn sm" type="button" data-a="wsearch">Cerca su Wikipedia</button>'+(s.w?'<button class="btn sm del" type="button" data-a="wunlink">Scollega</button>':'')+'</div><div class="sres" id="wres"></div>';
  h+='<p class="note">Se il luogo ha una voce di Wikipedia, collegarla basta a far comparire nella scheda il riassunto (breve) e la parte iniziale della voce (all’arrivo).</p></fieldset>';
  /* testo della scuola */
  h+='<fieldset><legend>Testo della scuola</legend><label class="f">Descrizione (sostituisce quella di Wikipedia nella scheda breve)<textarea id="ft">'+esc(s.t!=null?s.t:p.t0)+'</textarea></label><label class="row" style="color:var(--dim);font-size:14px"><input type="checkbox" id="fb"'+(s.bozza||(!s.t&&p.t0)?' checked':'')+'> Bozza da verificare</label></fieldset>';
  /* foto */
  h+='<fieldset><legend>Foto della scuola</legend><div class="thumbs" id="thumbs">'+(s.foto||[]).map(function(f,i){return'<div class="th"><img alt="" data-src="'+esc(f.src)+'"><input data-fi="'+i+'" data-ff="autore" placeholder="Autore" value="'+esc(f.autore)+'"><input data-fi="'+i+'" data-ff="licenza" placeholder="Licenza o permesso" value="'+esc(f.licenza)+'"><button class="btn sm del" type="button" data-a="fdel" data-i="'+i+'">Togli</button></div>';}).join('')+'</div>';
  h+='<div class="row"><label class="btn sm" for="fup">Carica foto</label><input id="fup" type="file" accept="image/*" multiple hidden><input id="furl" placeholder="oppure indirizzo di un’immagine (https://…)" style="flex:1;min-width:200px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px"><button class="btn sm" type="button" data-a="furl">Aggiungi</button></div>';
  h+='<p class="note">Usate foto scattate da voi o con licenza libera, e indicate sempre l’autore. Le foto caricate vengono ridotte a 1600 pixel.</p></fieldset>';
  /* video */
  h+='<fieldset><legend>Video</legend>'+(s.video||[]).map(function(v,i){return'<div class="item"><label class="f">Titolo<input data-vi="'+i+'" data-vf="titolo" value="'+esc(v.titolo)+'"></label><label class="f">Indirizzo (YouTube, Vimeo o file .mp4)<input data-vi="'+i+'" data-vf="url" value="'+esc(v.url)+'"></label><div class="row"><button class="btn sm del" type="button" data-a="vdel" data-i="'+i+'">Togli</button></div></div>';}).join('')+'<div class="row"><button class="btn sm" type="button" data-a="vadd">Aggiungi un video</button></div></fieldset>';
  /* approfondimenti */
  h+='<fieldset><legend>Approfondimenti (si vedono all’arrivo)</legend>'+(s.extra||[]).map(function(x,i){return'<div class="item"><label class="f">Titolo<input data-xi="'+i+'" data-xf="titolo" value="'+esc(x.titolo)+'"></label><label class="f">Testo<textarea data-xi="'+i+'" data-xf="testo">'+esc(x.testo)+'</textarea></label><div class="row"><button class="btn sm del" type="button" data-a="xdel" data-i="'+i+'">Togli</button></div></div>';}).join('')+'<div class="row"><button class="btn sm" type="button" data-a="xadd">Aggiungi un approfondimento</button></div></fieldset>';
  /* link */
  h+='<fieldset><legend>Link e documenti</legend>'+(s.link||[]).map(function(l,i){return'<div class="item"><label class="f">Titolo<input data-li="'+i+'" data-lf="titolo" value="'+esc(l.titolo)+'"></label><label class="f">Indirizzo<input data-li="'+i+'" data-lf="url" value="'+esc(l.url)+'"></label><div class="row"><button class="btn sm del" type="button" data-a="ldel" data-i="'+i+'">Togli</button></div></div>';}).join('')+'<div class="row"><button class="btn sm" type="button" data-a="ladd">Aggiungi un link</button></div></fieldset>';
  if(S.loc[p.k])h+='<div class="row"><button class="btn del" type="button" data-a="undo">Annulla le mie modifiche a questa scheda</button></div>';
  el.innerHTML=h;
  el.querySelectorAll('img[data-src]').forEach(function(i){imgURL(i.dataset.src,i);});
}
function help(){
  return'<h2>Come si lavora</h2><div class="help"><ol>'+
  '<li>Scegli un gruppo a sinistra (per esempio <b>Vuote</b>) e apri una scheda.</li>'+
  '<li>Collega la voce di Wikipedia, scrivi il testo, carica foto, aggiungi video, approfondimenti e link. Tutto si salva da solo su questo computer.</li>'+
  '<li>Quando hai finito una sessione: <b>Scarica le mie modifiche</b> e manda il file al responsabile del sito.</li>'+
  '<li>Il responsabile usa <b>Importa lavoro di un collega</b> per ogni file ricevuto, poi <b>Scarica per il sito</b>: ottiene un pacchetto con <code>schede.json</code> e la cartella <code>foto</code>, da caricare su GitHub accanto a <code>index.html</code>.</li></ol>'+
  '<p>Se due persone modificano la stessa scheda, vale la modifica più recente. Le schede modificate e non ancora pubblicate compaiono in arancione nell’elenco.</p>'+
  '<p>La casella <b>Radio nel gioco</b> accende o spegne la radio nel gioco per tutti: la scelta entra nel pacchetto di «Scarica per il sito» e vale quando il responsabile lo carica.</p>'+
  '<p>Questa pagina non ha password: chi la apre può preparare modifiche solo sul proprio computer. Il sito cambia soltanto quando il responsabile carica i file su GitHub.</p></div>';
}
var ED=$('ed');
ED.addEventListener('input',function(e){
  var t=e.target,k=S.sel;if(!k)return;var s=work(k),d=t.dataset;
  if(t.id==='ft')s.t=t.value;
  else if(t.id==='fb')s.bozza=t.checked;
  else if(d.fi!=null)s.foto[+d.fi][d.ff]=t.value;
  else if(d.vi!=null)s.video[+d.vi][d.vf]=t.value;
  else if(d.xi!=null)s.extra[+d.xi][d.xf]=t.value;
  else if(d.li!=null)s.link[+d.li][d.lf]=t.value;
  else return;
  clearTimeout(ED._t);ED._t=setTimeout(function(){touch(k);},400);
});
ED.addEventListener('change',function(e){var t=e.target;if(t.id==='fb'){work(S.sel).bozza=t.checked;touch(S.sel);}if(t.id==='fup')upload(t.files);});
ED.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;var k=S.sel,a=b.dataset.a,i=+b.dataset.i,s;
  if(a==='wsearch'){wsearch($('wq').value);return;}
  if(a==='wpick'){s=work(k);s.w='it:'+b.dataset.t;touch(k);edit();toast('Voce collegata');return;}
  if(a==='undo'){delete S.loc[k];saveLoc();draw();edit();return;}
  s=work(k);
  if(a==='wunlink')delete s.w;
  else if(a==='fdel')s.foto.splice(i,1);
  else if(a==='furl'){var u=$('furl').value.trim();if(!/^https?:\/\//.test(u)){toast('Scrivi un indirizzo che inizia con https://');return;}(s.foto=s.foto||[]).push({src:u,autore:'',licenza:''});}
  else if(a==='vadd')(s.video=s.video||[]).push({titolo:'',url:''});
  else if(a==='vdel')s.video.splice(i,1);
  else if(a==='xadd')(s.extra=s.extra||[]).push({titolo:'',testo:''});
  else if(a==='xdel')s.extra.splice(i,1);
  else if(a==='ladd')(s.link=s.link||[]).push({titolo:'',url:''});
  else if(a==='ldel')s.link.splice(i,1);
  touch(k);edit();
});
function wsearch(q){
  var box=$('wres');box.innerHTML='<p class="note">Cerco…</p>';
  fetch('https://it.wikipedia.org/w/api.php?format=json&origin=*&action=query&list=search&srlimit=6&srsearch='+encodeURIComponent(q))
    .then(function(r){return r.json();}).then(function(j){
      var L=(j.query&&j.query.search)||[];
      box.innerHTML=L.length?L.map(function(x){var sn=new DOMParser().parseFromString(String(x.snippet||''),'text/html').body;return'<button type="button" data-a="wpick" data-t="'+esc(x.title)+'"><b>'+esc(x.title)+'</b><small>'+esc(sn.textContent)+'…</small></button>';}).join('')+'<p class="note">Scegli la voce giusta: controlla che parli proprio di questo luogo.</p>':'<p class="note">Nessuna voce trovata.</p>';
    }).catch(function(){box.innerHTML='<p class="note">Senza rete la ricerca non funziona.</p>';});
}
function slug(t){return t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);}
function shrink(file){
  return new Promise(function(ok,ko){
    var im=new Image(),u=URL.createObjectURL(file);
    im.onload=function(){var k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?ok(b):ko(new Error('foto'));},'image/jpeg',.82);};
    im.onerror=function(){ko(new Error('foto'));};im.src=u;
  });
}
function upload(files){
  var k=S.sel,s=work(k),who=$('who').value.trim();s.foto=s.foto||[];
  Promise.all([].slice.call(files).map(function(f,i){return shrink(f).then(function(b){var name='foto/'+slug(BYK[k].n)+'-'+Date.now().toString(36)+i+'.jpg';return putImg(name,b).then(function(){s.foto.push({src:name,autore:who,licenza:'Per gentile concessione'});});});}))
    .then(function(){touch(k);edit();toast('Foto aggiunte');}).catch(function(){toast('Una foto non si è potuta leggere');});
}

/* ---------- pacchetti: scarica e importa ---------- */
function pack(keys,name){
  if(!window.JSZip){toast('Serve la rete per preparare il pacchetto');return;}
  var out={},z=new JSZip(),need={};
  keys.forEach(function(k){var s=cur(k);if(!s)return;out[k]=s;(s.foto||[]).forEach(function(f){if(/^foto\//.test(f.src))need[f.src]=1;});});
  z.file('schede.json',JSON.stringify({versione:1,aggiornato:new Date().toISOString(),impostazioni:S.imp,schede:out},null,1));
  Promise.all(Object.keys(need).map(function(n){return getImg(n).then(function(b){if(b)z.file(n,b);});}))
    .then(function(){return z.generateAsync({type:'blob'});})
    .then(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();});
}
$('expMine').addEventListener('click',function(){var k=Object.keys(S.loc);if(!k.length){toast('Non hai ancora modificato nessuna scheda');return;}pack(k,'schede-'+(slug($('who').value)||'modifiche')+'.zip');});
$('expAll').addEventListener('click',function(){var k={};Object.keys(S.base).concat(Object.keys(S.loc)).forEach(function(x){k[x]=1;});pack(Object.keys(k),'schede-per-il-sito.zip');});
$('imp').addEventListener('change',function(){
  var f=this.files[0];this.value='';if(!f)return;
  var job=/\.zip$/i.test(f.name)&&window.JSZip?JSZip.loadAsync(f).then(function(z){
      var tasks=[];z.forEach(function(path,ent){if(/^foto\/.+\.(jpe?g|png|webp)$/i.test(path))tasks.push(ent.async('blob').then(function(b){return putImg(path,b);}));});
      return Promise.all(tasks).then(function(){return z.file('schede.json').async('string');});
    }):f.text();
  job.then(function(txt){
    var j=JSON.parse(txt),sc=j.schede||{},n=0,skip=0;
    if(j.impostazioni&&typeof j.impostazioni.radio==='boolean'){S.imp.radio=j.impostazioni.radio;ls('imp',S.imp);impDraw();}
    Object.keys(sc).forEach(function(k){if(!BYK[k])return;var mine=cur(k);if(!mine||(sc[k].ts||0)>(mine.ts||0)){S.loc[k]=sc[k];n++;}else skip++;});
    saveLoc();draw();edit();toast(n+' schede importate'+(skip?', '+skip+' tenute perché più recenti':''));
  }).catch(function(){toast('Il file non è un pacchetto di schede');});
});

/* ---------- avvio ---------- */
db().then(function(){return idb('kv','readonly',function(s){return s.get('loc');});}).then(function(v){S.loc=v||{};}).catch(function(){S.loc={};})
  .then(function(){return fetch('schede.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():{};}).catch(function(){return{};});})
  .then(function(j){S.base=(j&&j.schede)||{};if(j&&j.impostazioni&&typeof j.impostazioni.radio==='boolean')S.impBase.radio=j.impostazioni.radio;var mi=ls('imp');S.imp={radio:mi&&typeof mi.radio==='boolean'?mi.radio:S.impBase.radio};impDraw();draw();edit();checkWeb();});
/* impostazioni del gioco valide per tutti: finiscono nel pacchetto per il sito */
function impDraw(){$('setRadio').checked=!!S.imp.radio;}
$('setRadio').addEventListener('change',function(){S.imp.radio=this.checked;ls('imp',S.imp);toast(this.checked?'Radio accesa nel gioco: vale per tutti dopo «Scarica per il sito» e il caricamento':'Radio tolta dal gioco: vale per tutti dopo «Scarica per il sito» e il caricamento');});
draw();edit();
})();
</script>
