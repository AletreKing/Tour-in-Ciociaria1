<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7b1e3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icona-32.png">
<link rel="apple-touch-icon" href="icona-180.png">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Mappa della Ciociaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: mappa a tutto schermo, pannello a destra sugli schermi larghi (LIM, PC), pannello dal basso sul telefono.
   Il segno grafico è il blocco di pietra delle mura poligonali: segnaposto e marchio sono poligoni irregolari. */
:root{
  --bg:#eef0eb; --land:#e3e7dc; --out:#d6dacf; --water:#9ec5d4; --ink:#1f2a26; --dim:#5d6a63; --line:#c3cbbf;
  --panel:#fbfcf8; --accent:#1e6a5a; --accent-ink:#ffffff; --route:#c9861d; --road:#a8ae9f; --road2:#8f9686; --hw:#5f9a6f; --trunk:#5d84b8;
  --c-arch:#b0781c; --c-fede:#4a5fa8; --c-cast:#7a5a86; --c-muse:#1f8a86; --c-nat:#3f8a3a; --c-lett:#b04a68; --c-alt:#7d857f; --c-serv:#c2513a; --trail:#8a5a2b; --bino:#2f5d73;
  --shadow:0 6px 24px rgba(31,42,38,.14);
  --f-disp:"Cinzel","Trajan Pro",Georgia,serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --land:#1a2320; --out:#0d1210; --water:#2f5664; --ink:#e7ece8; --dim:#9aa8a1; --line:#2c3833;
  --panel:#151d1a; --accent:#5cc2a8; --accent-ink:#0d1512; --route:#f0a83a; --road:#4b564f; --road2:#64706a; --hw:#5fae7c; --trunk:#6f98d2;
  --c-arch:#e0a440; --c-fede:#8ea2ec; --c-cast:#c19ccf; --c-muse:#4cc7c2; --c-nat:#7fc86f; --c-lett:#ec8aa6; --c-alt:#9aa59f; --c-serv:#ef8a70; --trail:#d8a066; --bino:#7fb6cf;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --land:#1a2320; --out:#0d1210; --water:#2f5664; --ink:#e7ece8; --dim:#9aa8a1; --line:#2c3833;
  --panel:#151d1a; --accent:#5cc2a8; --accent-ink:#0d1512; --route:#f0a83a; --road:#4b564f; --road2:#64706a; --hw:#5fae7c; --trunk:#6f98d2;
  --c-arch:#e0a440; --c-fede:#8ea2ec; --c-cast:#c19ccf; --c-muse:#4cc7c2; --c-nat:#7fc86f; --c-lett:#ec8aa6; --c-alt:#9aa59f; --c-serv:#ef8a70; --trail:#d8a066; --bino:#7fb6cf;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto auto 1fr}
.bar{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand h1{margin:0;font:700 22px/1 var(--f-disp);letter-spacing:.04em;white-space:nowrap}
.brand h1 em{font-style:normal;font-weight:500;color:var(--accent)}
.brand p{margin:2px 0 0;font-size:13px;color:var(--dim)}
.search{position:relative;margin-left:auto;flex:1 1 260px;max-width:420px;min-width:0}
.search input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit}
.qres{position:absolute;z-index:20;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:50vh;overflow:auto;padding:4px}
.qres button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.qres button:hover,.qres button:focus-visible{background:var(--bg)}
.qres small{color:var(--dim)}
.chips{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
.chip{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip i{width:11px;height:11px;flex:none;clip-path:polygon(18% 0,82% 6%,100% 52%,74% 100%,10% 88%,0 38%);background:var(--c)}
.chip[aria-pressed="false"]{opacity:.45}
.stage{position:relative;display:grid;grid-template-columns:1fr minmax(320px,400px);min-height:0}
.mapwrap{position:relative;min-width:0;min-height:0;background:var(--out)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#goHere{position:absolute;z-index:4;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--panel);color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:14px;transform:translate(-50%,calc(-100% - 12px));white-space:nowrap}
#goHere[hidden]{display:none}
#goHere button{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:inherit;padding:0 2px}
.mapbtns{position:absolute;right:12px;top:12px;display:grid;gap:6px}
.mapbtns button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);font-size:20px;cursor:pointer;display:grid;place-items:center}
.attr{position:absolute;left:10px;bottom:6px;margin:0;font-size:11px;color:var(--dim);background:color-mix(in srgb,var(--panel) 70%,transparent);padding:1px 6px;border-radius:6px}
.panel{display:grid;grid-template-rows:auto 1fr;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
.grip{display:none}
.tabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px 10px;font-weight:700;color:var(--dim);border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
#view{overflow:auto;padding:16px;min-height:0}
#view h2{margin:0 0 4px;font:700 22px/1.2 var(--f-disp);letter-spacing:.02em;text-wrap:balance}
#view h3{margin:18px 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.lede{margin:6px 0 12px;color:var(--dim)}
.back{display:block;border:0;background:none;color:var(--accent);font-weight:700;padding:0;margin-bottom:10px;cursor:pointer}
.cards{display:grid;gap:10px}
.pcard{display:grid;gap:4px;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;cursor:pointer}
.pcard:hover{border-color:var(--accent)}
.pcard .t{font:700 18px/1.25 var(--f-disp)}
.pcard .m{font-size:14px;color:var(--dim)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums}
.meta b{color:var(--ink)}
.stops{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:0}
.stops li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:8px 0;position:relative}
.stops li:not(:last-child)::before{content:"";position:absolute;left:16px;top:38px;bottom:-6px;width:2px;background:var(--line)}
.stops .n{width:34px;height:34px;display:grid;place-items:center;font-weight:700;color:var(--accent-ink);background:var(--route);clip-path:polygon(14% 2%,86% 0,100% 46%,82% 98%,12% 100%,0 50%)}
.stops button{border:0;background:none;text-align:left;padding:0;cursor:pointer;display:grid;gap:2px}
.stops .s{font-weight:700}
.stops .c{font-size:14px;color:var(--dim)}
.leg{grid-column:2;font-size:13px;color:var(--dim);margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 14px;font-weight:700;text-decoration:none;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.drive{flex:none;text-decoration:none;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:9px 16px}
.gal{margin:10px 0;display:grid;gap:6px}
.gal-main{margin:0;aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center}
.gal-main img{width:100%;height:100%;object-fit:cover;display:block}
.gal-empty{padding:16px;text-align:center;font-size:14px;color:var(--dim)}
.gal-cap{font-size:12px;color:var(--dim);min-height:1em}
.gal-cap a{color:var(--accent)}
.gal-thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.gal-thumbs button{flex:none;width:64px;height:48px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:var(--bg);cursor:pointer}
.gal-thumbs button[aria-current="true"]{border-color:var(--accent)}
.gal-thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.photo{aspect-ratio:16/9;max-width:100%;border-radius:12px;display:grid;place-items:center;text-align:center;font-size:14px;color:var(--dim);background:repeating-linear-gradient(135deg,var(--bg) 0 14px,var(--land) 14px 28px);border:1px dashed var(--line);margin:10px 0}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.tag i{width:10px;height:10px;background:var(--c);clip-path:polygon(18% 0,82% 6%,100% 52%,74% 100%,10% 88%,0 38%)}
.draft{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--route);border:1px solid var(--route);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.txt{margin:8px 0 0;max-width:62ch}
.empty{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--dim)}
.promo{margin-top:20px;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg)}
.promo .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.promo .t{font-weight:700;margin-top:2px}
.promo p{margin:4px 0 0;font-size:14px;color:var(--dim)}
.list{display:grid;gap:2px}
.list button{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:9px 6px;border-radius:8px;cursor:pointer}
.list button:hover{background:var(--bg)}
.list i{width:12px;height:12px;background:var(--c);clip-path:polygon(18% 0,82% 6%,100% 52%,74% 100%,10% 88%,0 38%)}
.list small{color:var(--dim);font-size:13px}
.q{margin-top:14px;display:grid;gap:8px}
.q p{margin:0;font-weight:700}
.q button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;cursor:pointer}
.q button.ok{border-color:var(--c-nat);background:color-mix(in srgb,var(--c-nat) 18%,var(--bg))}
.q button.no{border-color:var(--c-serv);background:color-mix(in srgb,var(--c-serv) 16%,var(--bg))}
.score{margin-top:16px;font-weight:700}
.chip.lst{font-weight:700;background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip.lst svg{width:14px;height:14px}
.grp{border-top:1px solid var(--line)}
.grp summary{display:grid;grid-template-columns:14px 1fr auto 14px;gap:10px;align-items:center;padding:12px 6px;cursor:pointer;list-style:none;font-weight:700}
.grp summary::-webkit-details-marker{display:none}
.grp summary i{width:12px;height:12px;background:var(--c);clip-path:polygon(18% 0,82% 6%,100% 52%,74% 100%,10% 88%,0 38%)}
.grp summary small{color:var(--dim);font-weight:400}
.grp summary::after{content:"›";color:var(--dim);transition:transform .2s;text-align:center}
.grp[open] summary::after{transform:rotate(90deg)}
.grp .list{padding:0 0 10px 0}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-bottom:8px}
.seg2 button{border:0;background:none;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:700}
.drv{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg)}
.drv .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
.drv .row{margin-top:0}
.drv .sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:14px;color:var(--dim)}
.drv .sub a{border:1px solid var(--line);border-radius:999px;padding:6px 11px;text-decoration:none;color:var(--ink);font-weight:700;background:var(--panel)}
.wtxt{white-space:pre-line}
.xh{font-size:17px;margin:18px 0 4px}
.vid{margin-top:8px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}.vid iframe,.vid video{width:100%;height:100%;border:0;display:block}.vid a{display:block;padding:14px;color:#fff}
.xl{margin:6px 0 0;padding-left:20px}
.wnote{font-size:13px;color:var(--dim);margin:8px 0 0}
.arr .hero{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:4px 0 0}
.arr .soon{margin-top:18px;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;color:var(--dim);font-size:14px}
.note{font-size:13px;color:var(--dim);margin-top:16px}
.chip svg.ic{width:16px;height:16px;flex:none}
.drv .tl{margin:0 0 8px;font-size:15px}
.drv + .drv{margin-top:10px}
.btn svg.ic{width:16px;height:16px;flex:none}
.drv .nt{margin:8px 0 0;font-size:13px;color:var(--dim)}
@media (max-width:820px){
  .brand p{display:none}
  .brand h1{font-size:19px}
  .stage{grid-template-columns:1fr}
  .panel{position:absolute;left:0;right:0;bottom:0;height:46%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:var(--shadow);transition:height .25s ease;z-index:5}
  .panel.min{height:96px}
  .panel.max{height:88%}
  .grip{display:block;width:100%;height:22px;border:0;background:none;cursor:pointer;position:relative}
  .grip::after{content:"";position:absolute;left:50%;top:8px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:var(--line)}
  .panel{grid-template-rows:auto auto 1fr}
  .tabs{padding-top:0}
  .mapbtns{top:10px}
}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
</style>

<div id="app">
  <header class="bar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M3 9 14 3l12 2 5 11-6 13-15 2-7-10z" fill="var(--accent)"/><path d="M14 3l1 12 11-10M15 15 3 9M15 15l-5 16M15 15l16 1" stroke="var(--panel)" stroke-width="1.6" fill="none"/></svg>
      <div><h1>Ciociaria <em>da scoprire</em></h1><p>Storia, arte e natura della provincia di Frosinone</p></div>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Cerca un luogo o un comune" aria-label="Cerca un luogo o un comune" autocomplete="off">
      <div id="qres" class="qres" hidden></div>
    </div>
    <a class="drive" href="guida.html">Guida libera</a>
  </header>
  <div class="chips" id="chips" role="group" aria-label="Categorie mostrate sulla mappa"></div>
  <main class="stage">
    <div class="mapwrap">
      <canvas id="map" aria-label="Mappa della provincia di Frosinone con i luoghi da visitare"></canvas>
      <div class="mapbtns">
        <button type="button" id="zin" aria-label="Ingrandisci">+</button>
        <button type="button" id="zout" aria-label="Rimpicciolisci">−</button>
        <button type="button" id="zall" aria-label="Tutta la provincia">⌂</button>
      </div>
      <div id="goHere" hidden><span>Vuoi andare qui in auto?</span><a class="btn pri" id="goHereA" href="guida.html">Guida fin qui</a><button type="button" id="goHereX" aria-label="Chiudi">×</button></div>
      <p class="attr">Mappa © OpenStreetMap contributors</p>
    </div>
    <aside class="panel" id="panel">
      <button class="grip" id="grip" type="button" aria-label="Allarga o riduci il pannello"></button>
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="perc" aria-selected="true">Percorsi</button>
        <button type="button" role="tab" data-tab="luoghi" aria-selected="false">Luoghi</button>
        <button type="button" role="tab" data-tab="serv" aria-selected="false">Servizi</button>
      </nav>
      <section id="view" aria-live="polite"></section>
    </aside>

o del Duecento per volontà di papa Innocenzo III, sorge isolata nei boschi dei monti Ernici, sopra Collepardo. È celebre la sua antica farmacia.","bozza":true},"Abbazia di Casamari":{"t":"Abbazia cistercense nel territorio di Veroli. La chiesa, consacrata nel 1217, è uno degli esempi più puri dell'architettura gotico-cistercense in Italia.","bozza":true},"Abbazia di Montecassino":{"t":"Fondata da san Benedetto intorno al 529, è la culla del monachesimo benedettino. Fu distrutta dal bombardamento del 15 febbraio 1944, durante la battaglia di Cassino, poi ricostruita e riconsacrata nel 1964.","bozza":true},"Lago di Posta Fibreno":{"t":"Lago alimentato da sorgenti, al centro di una riserva naturale regionale. È noto per la «rota», un'isola galleggiante di torba e vegetazione.","bozza":true},"Cascata Grande":{"t":"Nel centro di Isola del Liri il fiume precipita per quasi trenta metri accanto al castello Boncompagni-Viscogliosi. È un caso raro di cascata nel cuore di un paese.","bozza":true},"Pico, il paese di Tommaso Landolfi":{"t":"Tommaso Landolfi (Pico, 1908 – Ronciglione, 1979) è stato narratore, poeta e traduttore, soprattutto dal russo e dal francese. Nel romanzo breve «La pietra lunare» (1939), «scene della vita di provincia» in un paese che ricorda Pico, lo studente Giovancarlo torna a casa per l'estate e si innamora di Gurù, una ragazza misteriosa che in certe notti diventa capra.","bozza":true},"Castro dei Volsci, il paese di Nino Manfredi":{"t":"Nino Manfredi (Castro dei Volsci, 1921 – Roma, 2004) è stato attore, regista e sceneggiatore. Da ragazzo, ricoverato a lungo in sanatorio per la tubercolosi, imparò a suonare il banjo. Nel 1970 portò al successo «Tanto pe' cantà», canzone di Ettore Petrolini.","bozza":true},"Castello Teofilatto (Caetani)":{"t":"Nato come torre di guardia, fu fortificato tra X e XI secolo. Nel 1295 lo acquistò Roffredo Caetani, fratello di papa Bonifacio VIII: dai Caetani prende il nome il paese. Danneggiato dai terremoti del 1349 e del 1915, dal 1958 è della famiglia Teofilatto.","bozza":true}},"percorsi":[{"id":"mura","titolo":"Le città delle mura poligonali","tema":"Archeologia","intro":"Prima di Roma, Ernici e Volsci cinsero le loro città con mura di blocchi enormi, incastrati senza malta. Tre città, quattro tappe per vederle da vicino.","tappe":["Porta Sanguinaria","Mercato romano","Acropoli (Civita) Di Alatri","Acropoli di Civitavecchia"],"quiz":[{"d":"Come si chiama la tecnica delle mura di Alatri e Ferentino?","r":["Opera poligonale","Opera reticolata","Opera laterizia"],"ok":0,"tappa":"Acropoli (Civita) Di Alatri"},{"d":"Quale grande oratore romano nacque ad Arpino?","r":["Seneca","Cicerone","Catone"],"ok":1,"tappa":"Acropoli di Civitavecchia"},{"d":"Che cosa sorge sulla spianata dell'acropoli di Alatri?","r":["Un castello","Un teatro","La concattedrale di San Paolo"],"ok":2,"tappa":"Acropoli (Civita) Di Alatri"}]},{"id":"abbazie","titolo":"Abbazie e certose","tema":"Fede e abbazie","intro":"Tre grandi monasteri, tre storie diverse: dai boschi degli Ernici alla collina di Cassino.","tappe":["Certosa di Trisulti","Abbazia di Casamari","Abbazia di Montecassino"],"quiz":[{"d":"Chi fondò l'abbazia di Montecassino?","r":["San Benedetto","San Francesco","San Bernardo"],"ok":0,"tappa":"Abbazia di Montecassino"},{"d":"A quale ordine appartiene l'abbazia di Casamari?","r":["Francescani","Cistercensi","Gesuiti"],"ok":1,"tappa":"Abbazia di Casamari"},{"d":"In che anno fu distrutta Montecassino dai bombardamenti?","r":["1915","1940","1944"],"ok":2,"tappa":"Abbazia di Montecassino"}]},{"id":"acque","titolo":"Le acque della valle","tema":"Natura","intro":"Il Fibreno e il Liri: un lago di sorgente con un'isola che galleggia e una cascata in pieno centro abitato.","tappe":["Lago di Posta Fibreno","Cascata Grande"],"quiz":[{"d":"Che cos'è la «rota» del lago di Posta Fibreno?","r":["Un mulino","Un'isola galleggiante","Una sorgente calda"],"ok":1,"tappa":"Lago di Posta Fibreno"},{"d":"In quale paese il Lir       if(!list.length){main.innerHTML='<div class="gal-empty">'+(note||'Nessuna foto per ora: si possono aggiungere quelle scattate dalla classe.')+'</div>';cap.textContent='';th.innerHTML='';return;}

        img.onerror=function(){main.innerHTML='<div class="gal-empty">Questa foto non si riesce a caricare.</div>';};main.appendChild(img);

    }
    var src=poi.wd?wiki(poi.wd):poi.w?wpImg(poi.w):null;
    if(src)src.then(function(w){show(mine.concat(w));}).catch(function(){show(mine,'Le foto arrivano da Wikimedia Commons e servono la rete: qui non si possono caricare (nell’anteprima dentro Claude è normale, sul sito si vedono).');});
    else show(mine);
  }
  /* ---- testo da Wikipedia: breve (riassunto) o esteso (prima parte della voce) ---- */
  var tcache={};
  function title(poi){
    if(poi.w){var wl=poi.w.split(':'),lang=wl.shift();return Promise.resolve({lang:lang,t:wl.join(':')});}
    if(!poi.wd)return Promise.reject(new Error('no'));
    return api('www.wikidata.org',{action:'wbgetentities',ids:poi.wd,props:'sitelinks',sitefilter:'itwiki|enwiki'}).then(function(j){
      var sl=(j.entities&&j.entities[poi.wd]&&j.entities[poi.wd].sitelinks)||{};
      if(sl.itwiki)return{lang:'it',t:sl.itwiki.title};if(sl.enwiki)return{lang:'en',t:sl.enwiki.title};throw new Error('no');});
  }
  function wtext(poi,full){
    var key=(poi.wd||poi.w||poi.n)+(full?'|f':'|b');if(tcache[key])return tcache[key];
    tcache[key]=title(poi).then(function(T){
      var q={action:'query',prop:'extracts',explaintext:1,exsectionformat:'plain',redirects:1,titles:T.t};
      if(full)q.exchars=2600;else q.exintro=1;
      return api(T.lang+'.wikipedia.org',q).then(function(j){
        var pg=j.query&&j.query.pages,k=pg&&Object.keys(pg)[0],x=k&&pg[k].extract||'';if(!x)throw new Error('vuoto');
        x=x.replace(/\s*\([^()]*\)/,'').replace(/\n{2,}/g,'\n').trim();
        if(!full){var se=x.split('\n')[0].match(/[^.!?]+[.!?]+(\s|$)/g)||[x],o='';for(var i=0;i<se.length&&(o.length<180||i<1)&&i<3;i++)o+=se[i];x=o.trim();if(x.length>480)x=x.slice(0,470).replace(/\s\S*$/,'')+'…';}
        return{t:x,lang:T.lang,url:'https://'+T.lang+'.wikipedia.org/wiki/'+encodeURIComponent(T.t.replace(/ /g,'_'))};
      });
    });
    tcache[key].catch(function(){delete tcache[key];});
    return tcache[key];
  }
  /* el: contenitore; il testo della scuola (poi.t) viene prima; da Wikipedia arriva il resto, con la fonte */
  function text(el,poi,full){
    el.textContent='';
    function para(t,cls){t.split('\n').forEach(function(line){line=line.trim();if(!line)return;var p=document.createElement('p');p.className=cls||'txt';p.textContent=line;el.appendChild(p);});}

      var s=document.createElement('p');s.className='wnote';s.appendChild(document.createTextNode('Testo: '));var a=document.createElement('a');a.href=r.url;a.target='_blank';a.rel='noopener';a.textContent='Wikipedia';s.appendChild(a);s.appendChild(document.createTextNode(' · licenza CC BY-SA 4.0'));el.appendChild(s);
    }).catch(function(){wait.textContent=poi.t?'':(poi.wd||poi.w?'La descrizione arriva da Wikipedia e serve la rete: qui non si carica (nell’anteprima dentro Claude è normale, sul sito si vede).':'Scheda ancora da scrivere: è uno dei luoghi che la classe può raccontare.');});
  }
  /* ---- schede compilate dagli amministratori: file schede.json accanto alla pagina ---- */
  var schedeP=null;
  function loadSchede(){
    if(!schedeP)schedeP=fetch('schede.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('no');return r.json();}).then(function(j){return(j&&j.schede)||{};}).catch(function(){return{};});
    return schedeP;
  }
  function apply(poi,s){
    if(!s)return;

    if(s.w)poi.w=s.w;
    if(s.foto&&s.foto.length)poi.foto=s.foto.concat(poi.foto0||[]);
    poi.video=s.video||[];poi.extra=s.extra||[];poi.link=s.link||[];
  }
  function vEmbed(u){
    var m=/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{6,})/.exec(u);if(m)return'https://www.youtube-nocookie.com/embed/'+m[1];
    m=/vimeo\.com\/(\d+)/.exec(u);if(m)return'https://player.vimeo.com/video/'+m[1];
    return null;
  }
  /* approfondimenti, video e link aggiunti dalla scuola */
  function extras(el,poi){
    el.textContent='';
    function h(t){var x=document.createElement('h3');x.className='xh';x.textContent=t;el.appendChild(x);}
    (poi.extra||[]).forEach(function(x){if(x.titolo)h(x.titolo);String(x.testo||'').split('\n').forEach(function(l){if(!l.trim())return;var p=document.createElement('p');p.className='txt';p.textContent=l;el.appendChild(p);});});
    (poi.video||[]).forEach(function(v){
      if(v.titolo)h(v.titolo);var e=vEmbed(v.url||''),box=document.createElement('div');box.className='vid';
      if(e){var f=document.createElement('iframe');f.src=e;f.loading='lazy';f.allow='encrypted-media; picture-in-picture; fullscreen';f.title=v.titolo||'Video';box.appendChild(f);}
      else if(!okUrl(v.url)){return;}
      else if(/\.(mp4|webm)(\?|$)/i.test(v.url||'')){var vd=document.createElement('video');vd.src=v.url;vd.controls=true;vd.preload='none';box.appendChild(vd);}
      else{var a=document.createElement('a');a.href=v.url;a.target='_blank';a.rel='noopener';a.textContent='Guarda il video';box.appendChild(a);}
      el.appendChild(box);
    });
    if((poi.link||[]).length){h('Per saperne di più');var ul=document.createElement('ul');ul.className='xl';poi.link.forEach(function(l){if(!okUrl(l.url))return;var li=document.createElement('li'),a=document.createElement('a');a.href=l.url;a.target='_blank';a.rel='noopener';a.textContent=l.titolo||l.url;li.appendChild(a);ul.appendChild(li);});el.appendChild(ul);}
  }
  return{render:render,text:text,loadSchede:loadSchede,apply:apply,extras:extras,vEmbed:vEmbed};
})();
</script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var D=JSON.parse($('data').textContent);
var CAT={arch:'Archeologia',fede:'Fede e abbazie',cast:'Castelli e torri',muse:'Musei',nat:'Natura',lett:'Luoghi letterari',alt:'Altri luoghi',serv:'Servizi'};
var LAT0=D.lat0,LON0=D.lon0,KX=Math.cos(LAT0*Math.PI/180)*111320,KZ=110574;
function P(lon,lat){return[-(lon-LON0)*KX,(lat-LAT0)*KZ];}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function km(m){return (m/1000).toFixed(m<10000?1:0).replace('.',',')+' km';}
function ore(s){var m=Math.round(s/60);return m<60?m+' min':Math.floor(m/60)+' h '+(m%60?m%60+' min':'');}

/* ---------- rete stradale ---------- */
var NN=D.nodes.length,NX=new Float64Array(NN),NZ=new Float64Array(NN),ADJ=[],E=[],i,k;
for(i=0;i<NN;i++){NX[i]=D.nodes[i][0]/10;NZ[i]=D.nodes[i][1]/10;ADJ.push([]);}
var SPD=[130,110,90,70,60];
D.edges.forEach(function(r,ei){
  var f=r[4],p=[],X=0,Z=0,len=0;for(var j=0;j<f.length;j+=2){X+=f[j];Z+=f[j+1];p.push(X/10,Z/10);if(j)len+=Math.hypot(p[p.length-2]-p[p.length-4],p[p.length-1]-p[p.length-3]);}
  var a=1e9,b=-1e9,c=1e9,d=-1e9;for(j=0;j<p.length;j+=2){a=Math.min(a,p[j]);b=Math.max(b,p[j]);c=Math.min(c,p[j+1]);d=Math.max(d,p[j+1]);}
  E.push({a:r[0],b:r[1],cls:r[2]&7,link:(r[2]&8)>0,ow:r[3],p:p,len:len,bb:[a,c,b,d]});
  ADJ[r[0]].push(ei);if(r[1]!==r[0])ADJ[r[1]].push(ei);
});
function nearNode(x,z){var b=-1,bd=1e18;for(var i=0;i<NN;i++){if(!D.main[i])continue;var d=(NX[i]-x)*(NX[i]-x)+(NZ[i]-z)*(NZ[i]-z);if(d<bd){bd=d;b=i;}}return b;}
function route(src,dst,strict){
  var Dd=new Float64Array(NN).fill(Infinity),PE=new Int32Array(NN).fill(-1),hk=[],hv=[];
  function push(key,v){hk.push(key);hv.push(v);var i=hk.length-1;while(i>0){var p=(i-1)>>1;if(hk[p]<=hk[i])break;var t=hk[p];hk[p]=hk[i];hk[i]=t;t=hv[p];hv[p]=hv[i];hv[i]=t;i=p;}}
  function pop(){var v=hv[0],top=hk[0],lk=hk.pop(),lv=hv.pop(),n=hk.length;if(n){hk[0]=lk;hv[0]=lv;var i=0;for(;;){var l=2*i+1,r=l+1,m=i;if(l<n&&hk[l]<hk[m])m=l;if(r<n&&hk[r]<hk[m])m=r;if(m===i)break;var t=hk[m];hk[m]=hk[i];hk[i]=t;t=hv[m];hv[m]=hv[i];hv[i]=t;i=m;}}return[v,top];}
  Dd[src]=0;push(0,src);
  while(hk.length){var q=pop(),u=q[0];if(q[1]>Dd[u])continue;if(u===dst)break;
    for(var j=0;j<ADJ[u].length;j++){var ei=ADJ[u][j],e=E[ei];if(e.a===e.b)continue;var fw=e.a===u,v=fw?e.b:e.a;
      if(strict&&((e.ow===1&&!fw)||(e.ow===-1&&fw)))continue;var w=Dd[u]+e.len/((e.link?50:SPD[e.cls])/3.6);if(w<Dd[v]){Dd[v]=w;PE[v]=ei;push(w,v);}}}
  if(!isFinite(Dd[dst]))return null;
  var pts=[],u2=dst,list=[];while(u2!==src){var ei2=PE[u2];list.push([ei2,u2]);u2=E[ei2].a===u2?E[ei2].b:E[ei2].a;}
  list.reverse();var len=0;
  list.forEach(function(it){var e=E[it[0]],p=e.p,n=p.length/2,toB=e.b===it[1];for(var j=0;j<n;j++){var jj=toB?j:n-1-j;pts.push(p[2*jj],p[2*jj+1]);}len+=e.len;});
  return{pts:pts,len:len,t:Dd[dst]};
}

/* ---------- luoghi ---------- */
var POI=D.poi.map(function(o,i){var q=P(o.lon,o.lat),t=D.testi[o.n];return{id:i,n:t&&t.nome||o.n,key:o.n,c:CAT[o.c]?o.c:'alt',com:o.com,lat:o.lat,lon:o.lon,x:q[0],z:q[1],w:o.w,wd:o.wd||'',foto:t&&t.foto||[],foto0:t&&t.foto||[],t:t?t.t:'',bozza:t?t.bozza:false,hid:!!o.h};});
var byName={};POI.forEach(function(p){if(!byName[p.key])byName[p.key]=p;});
/* ---------- sentieri a piedi (cartello con la scarpa) e belvedere (binocolo) ---------- */
var TRK=D.trek||{tr:[],bel:[]},TR=[],HEADS=[],BEL=[],TRBY={},BELBY={};
TRK.tr.forEach(function(r,i){
  var f=r[3],X=0,Z=0,p=[],j;for(j=0;j<f.length;j+=2){X+=f[j];Z+=f[j+1];p.push(X,Z);}
  var a=1e9,b=-1e9,c=1e9,d=-1e9;for(j=0;j<p.length;j+=2){a=Math.min(a,p[j]);b=Math.max(b,p[j]);c=Math.min(c,p[j+1]);d=Math.max(d,p[j+1]);}
  var t={i:i,poi:POI[r[0]],len:r[1],up:r[2],p:p,bb:[a,c,b,d]};if(!t.poi)return;TR.push(t);(TRBY[r[0]]=TRBY[r[0]]||[]).push(t);
  var h=null;for(j=0;j<HEADS.length;j++)if(Math.hypot(HEADS[j].x-p[0],HEADS[j].z-p[1])<40){h=HEADS[j];break;}
  if(!h){h={i:HEADS.length,x:p[0],z:p[1],tr:[]};HEADS.push(h);}h.tr.push(t);t.head=h;
});
TRK.bel.forEach(function(b,i){var o={i:i,x:b[0],z:b[1],n:b[2],v:b[3].map(function(k){return POI[k];}).filter(function(p){return p&&!p.hid;}),com:b[4]||''};BEL.push(o);o.v.forEach(function(p){(BELBY[p.id]=BELBY[p.id]||[]).push(o);});});
function trTime(t){var m=Math.round((t.len/1000/4+t.up/600)*60);return m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+(m%60<10?'0':'')+(m%60):'');}
var SVG_SHOE='<svg class="ic" viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M28 6 58 4 60 40Q66 50 82 56 98 61 98 74V80H20L19 60Q22 36 28 6Z"/><path fill="currentColor" d="M18 84h82v7H18z"/></svg>';
var SVG_BINO='<svg class="ic" viewBox="0 0 104 90" aria-hidden="true"><g fill="currentColor"><circle cx="26" cy="62" r="24"/><circle cx="78" cy="62" r="24"/><rect x="14" y="14" width="22" height="40"/><rect x="68" y="14" width="22" height="40"/><rect x="36" y="30" width="32" height="16"/></g></svg>';
var PERC=D.percorsi.map(function(pc){
  var st=pc.tappe.map(function(n){return byName[n];}).filter(Boolean),legs=[],tot=0,time=0,pts=[];
  for(var j=1;j<st.length;j++){
    var dd=Math.hypot(st[j].x-st[j-1].x,st[j].z-st[j-1].z);
    if(dd<1500){legs.push({walk:true,len:dd*1.3,t:dd*1.3/1.25});continue;}   /* tappe vicine: si va a piedi */
    var a=nearNode(st[j-1].x,st[j-1].z),b=nearNode(st[j].x,st[j].z),r=a===b?{pts:[],len:0,t:0}:(route(a,b,true)||route(a,b,false));
    legs.push(r);if(r){tot+=r.len;time+=r.t;pts.push(r.pts);}
  }
  return{id:pc.id,titolo:pc.titolo,tema:pc.tema,intro:pc.intro,tappe:st,legs:legs,len:tot,time:time,pts:pts,quiz:pc.quiz||[]};
});

/* ---------- stato ---------- */
var S={trek:1,th:null,bel:null,group:'cat',open:{},cats:{arch:1,fede:1,cast:1,muse:1,nat:1,alt:1,serv:0},tab:'perc',perc:null,poi:null,view:'list',cx:0,cz:0,k:.01,fit:.01,W:1,H:1,dpr:1};
try{var sv=JSON.parse(localStorage.getItem('cds_cats')||'null');if(sv)S.cats=Object.assign(S.cats,sv);if(localStorage.getItem('cds_trek')==='0')S.trek=0;}catch(e){}

/* ---------- filtri ---------- */

  var h='<button type="button" class="chip lst" data-list="1"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12M2 8h12M2 13h12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Elenco per gruppo</button>';Object.keys(CAT).forEach(function(c){h+='<button type="button" class="chip" data-c="'+c+'" aria-pressed="'+(S.cats[c]?'true':'false')+'" style="--c:var(--c-'+c+')"><i></i>'+CAT[c]+'</button>';});

  var pr=(D.promo||[]).filter(function(x){return !x.percorso||x.percorso===(S.perc&&S.perc.id);});
  if(pr.length)return pr.map(function(x){return'<div class="promo"><div class="k">Promozione</div><div class="t">'+esc(x.titolo)+'</div><p>'+esc(x.testo||'')+'</p>'+(x.link?'<div class="row"><a class="btn" href="'+esc(x.link)+'" target="_blank" rel="noopener">Sito</a></div>':'')+'</div>';}).join('');

    });

    var bl=S.bel;
    h+='<button class="back" type="button" data-act="back">← Indietro</button><span class="tag" style="--c:var(--bino)"><i></i>Belvedere</span><h2>'+esc(bl.n)+'</h2><div class="meta"><span>'+esc(bl.com)+'</span><span><b>'+bl.v.length+'</b> luoghi in vista</span></div>';

  D.comuni.forEach(function(c){

    cx.font=(c.big?'700 14px ':'400 12px ')+'"Atkinson Hyperlegible",sans-serif';
    var w=cx.measureText(c.n).width,b=[q[0]-2,q[1]-8,q[0]+w+8,q[1]+8],free=true;
    for(var m=0;m<boxes.length;m++){var o=boxes[m];if(b[0]<o[2]&&b[2]>o[0]&&b[1]<o[3]&&b[3]>o[1]){free=false;break;}}
    if(!free&&!c.big)return;boxes.push(b);
    cx.fillStyle=col('--dim');cx.beginPath();cx.arc(q[0],q[1],c.big?3:2,0,7);cx.fill();cx.fillStyle=col('--ink');cx.globalAlpha=c.big?.95:.75;cx.fillText(c.n,q[0]+6,q[1]);cx.globalAlpha=1;
  });
  /* luoghi */
  var r0=clamp(k*260,4.5,9),sel=S.poi,onP={};if(pc)pc.tappe.forEach(function(t,i){onP[t.id]=i+1;});
  POI.forEach(function(p){
    if(p.hid||(!S.cats[p.c]&&!onP[p.id]))return;var q=SX(p.x,p.z);if(q[0]<-20||q[0]>W+20||q[1]<-20||q[1]>H+20)return;
    if(pc&&!onP[p.id]){cx.globalAlpha=.35;}
    stone(q[0],q[1],r0,p.id%7+1);cx.fillStyle=col('--c-'+p.c);cx.fill();cx.strokeStyle=col('--panel');cx.lineWidth=1.5;cx.stroke();cx.globalAlpha=1;
  });
  if((S.trek&&k>=.02)||S.th||S.bel){
    var ri=clamp(k*500,9,13),few=!(S.trek&&k>=.02);
    BEL.forEach(function(b){if(few&&b!==S.bel)return;var q=SX(b.x,b.z);if(q[0]<-20||q[0]>W+20||q[1]<-20||q[1]>H+20)return;icon(q[0],q[1],b===S.bel?ri+4:ri,'--bino',glyphBino);});
    HEADS.forEach(function(hd){if(few&&hd!==S.th)return;var q=SX(hd.x,hd.z);if(q[0]<-20||q[0]>W+20||q[1]<-20||q[1]>H+20)return;icon(q[0],q[1],hd===S.th?ri+4:ri,'--trail',glyphShoe);});
  }
  if(pc)pc.tappe.forEach(function(t,i){var q=SX(t.x,t.z);stone(q[0],q[1],14,i+2);cx.fillStyle=col('--route');cx.fill();cx.strokeStyle=col('--panel');cx.lineWidth=2.5;cx.stroke();cx.fillStyle=col('--accent-ink');cx.font='700 13px "Atkinson Hyperlegible",sans-serif';cx.textAlign='center';cx.fillText(''+(i+1),q[0],q[1]+1);cx.textAlign='left';});
  if(sel){var q2=SX(sel.x,sel.z);stone(q2[0],q2[1],r0+7,3);cx.strokeStyle=col('--ink');cx.lineWidth=2.5;cx.stroke();
    cx.font='700 14px "Atkinson Hyperlegible",sans-serif';var tw=cx.measureText(sel.n).width;cx.fillStyle=col('--panel');cx.fillRect(q2[0]+r0+8,q2[1]-12,tw+12,24);cx.fillStyle=col('--ink');cx.fillText(sel.n,q2[0]+r0+14,q2[1]);}
  /* scala */
  var sm=k>.05?500:k>.015?2000:10000,sl=sm*k;cx.strokeStyle=col('--ink');cx.lineWidth=2;cx.beginPath();cx.moveTo(14,H-30);cx.lineTo(14+sl,H-30);cx.stroke();
  cx.fillStyle=col('--ink');cx.font='400 12px "Atkinson Hyperlegible",sans-serif';cx.fillText(sm>=1000?sm/1000+' km':sm+' m',14,H-40);
}
function zoom(fk,sx,sy){if(sx==null){sx=S.W/2;sy=S.H/2;}var wx=S.cx-(sx-S.W/2)/S.k,wz=S.cz-(sy-S.H/2)/S.k;S.k=clamp(S.k*fk,S.fit*.7,1.2);S.cx=wx+(sx-S.W/2)/S.k;S.cz=wz+(sy-S.H/2)/S.k;draw();}
var ptr={},moved=0,tap=false;
cv.addEventListener('pointerdown',function(e){try{cv.setPointerCapture(e.pointerId);}catch(er){}ptr[e.pointerId]=[e.offsetX,e.offsetY];moved=0;tap=Object.keys(ptr).length===1;cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',function(e){var p=ptr[e.pointerId];if(!p)return;var ids=Object.keys(ptr);
  if(ids.length===1){var dx=e.offsetX-p[0],dy=e.offsetY-p[1];S.cx+=dx/S.k;S.cz+=dy/S.k;moved+=Math.abs(dx)+Math.abs(dy);draw();if(moved>8)$('goHere').hidden=true;}
  else if(ids.length===2){var o=ptr[ids[0]==e.pointerId?ids[1]:ids[0]],d0=Math.hypot(p[0]-o[0],p[1]-o[1]),d1=Math.hypot(e.offsetX-o[0],e.offsetY-o[1]);if(d0>10)zoom(d1/d0,(e.offsetX+o[0])/2,(e.offsetY+o[1])/2);tap=false;}
  ptr[e.pointerId]=[e.offsetX,e.offsetY];});
var lastUp=0,lux=0,luy=0;
function goHere(sx,sy){var wx=S.cx-(sx-S.W/2)/S.k,wz=S.cz-(sy-S.H/2)/S.k,g=$('goHere');$('goHereA').href='guida.html#vai-xy-'+Math.round(wx)+'-'+Math.round(wz);g.style.left=Math.max(120,Math.min(S.W-120,sx))+'px';g.style.top=Math.max(70,sy)+'px';g.hidden=false;}
$('goHereX').addEventListener('click',function(){$('goHere').hidden=true;});
function up(e){var t=tap&&moved<8&&ptr[e.pointerId]&&e.type==='pointerup';delete ptr[e.pointerId];cv.style.cursor='grab';
  if(t){var now=performance.now();if(now-lastUp<380&&Math.abs(e.offsetX-lux)<24&&Math.abs(e.offsetY-luy)<24){lastUp=0;goHere(e.offsetX,e.offsetY);}else{lastUp=now;lux=e.offsetX;luy=e.offsetY;$('goHere').hidden=true;pick(e.offsetX,e.offsetY);}}
  tap=false;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',function(e){e.preventDefault();zoom(Math.exp(-e.deltaY*.0015),e.offsetX,e.offsetY);},{passive:false});
function pick(sx,sy){
  var ib=null,id=18*18,ik='';
  if(S.trek&&S.k>=.02){
    HEADS.forEach(function(hd){var q=SX(hd.x,hd.z),d=(q[0]-sx)*(q[0]-sx)+(q[1]-sy)*(q[1]-sy);if(d<id){id=d;ib=hd;ik='th';}});
    BEL.forEach(function(b){var q=SX(b.x,b.z),d=(q[0]-sx)*(q[0]-sx)+(q[1]-sy)*(q[1]-sy);if(d<id){id=d;ib=b;ik='bel';}});
  }
  var best=null,bd=22*22,onP={};if(S.perc)S.perc.tappe.forEach(function(t){onP[t.id]=1;});
  POI.forEach(function(p){if(p.hid||(!S.cats[p.c]&&!onP[p.id]))return;var q=SX(p.x,p.z),d=(q[0]-sx)*(q[0]-sx)+(q[1]-sy)*(q[1]-sy);if(d<bd){bd=d;best=p;}});
  if(ib&&(!best||id<bd)){if(ik==='th')openTh(ib,true);else openBel(ib,true);return;}
  if(best){if(S.tab==='serv')setTab('luoghi');openPoi(best,true);}
}
$('zin').addEventListener('click',function(){zoom(1.6);});
$('zout').addEventListener('click',function(){zoom(1/1.6);});
$('zall').addEventListener('click',fitAll);

if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);

drawChips();render();resize();

var hp=/^p-(\d+)$/.exec(h);if(hp&&POI[+hp[1]]){setTab('luoghi');openPoi(POI[+hp[1]]);}
var ha=/^arrivo-(\d+)$/.exec(h);if(ha&&POI[+ha[1]]){setTab('luoghi');openPoi(POI[+ha[1]]);S.view='arrivo';render();}
window.__cds={HEADS:HEADS,BEL:BEL,TR:TR,openTh:openTh,openBel:openBel,S:S,PERC:PERC,POI:POI,draw:draw};
})();
